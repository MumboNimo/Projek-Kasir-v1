<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KasirKu v1</title>
    <!--
      Font DM Sans dari Google Fonts
      Dimuat di sini supaya tersedia sejak awal sebelum Vue mount
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      #app = titik mount Vue.
      Semua UI Vue akan dirender di dalam div ini.
      Sebelum Vue mount, div ini kosong.
    -->
    <div id="app"></div>

    <!--
      type="module" = memberitahu browser ini adalah ES Module
      Vite akan memproses main.js dan semua import-nya
    -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
